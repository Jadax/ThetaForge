name: Keep Advisor warm

# Render's free tier sleeps a web service after 15 minutes with no HTTP
# traffic, and fully restarts the container on the next request. That reset
# would silently wipe data/iv_history.json (the real per-symbol IV history
# behind IV Rank/Percentile — see docs/SIGNAL_POLICY.md) and the background
# scanner's 300-second cadence (agents/trade_engine/background_scanner.py)
# every time it happened, not just on redeploy.
#
# A ping every 10 minutes stays comfortably inside that 15-minute window, so
# the instance never actually sleeps under normal operation. It hits the
# public /health probe only — no ADVISOR_API_TOKEN needed here, and no
# secrets to manage in this workflow.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Advisor health probe
        run: |
          url="https://thetaforge-advisor.onrender.com/health/"
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
          echo "GET $url -> $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Advisor health check returned $status (expected 200)"
            exit 1
          fi
