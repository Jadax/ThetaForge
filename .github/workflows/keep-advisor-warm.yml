name: Advisor health monitor

# The Advisor runs on Google Cloud (always-free e2-micro, never sleeps), so a
# warm-up ping is unnecessary. This workflow is now a watchdog: it probes the
# public /health endpoint every 10 minutes from GitHub's runners and fails
# (notifying on the repository's commit/status page) the moment the Advisor
# stops answering.
#
# Uses the public /health probe only — no ADVISOR_API_TOKEN needed here, and
# no secrets to manage in this workflow.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Advisor health probe
        run: |
          url="http://35.212.227.109:8000/health/"
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
          echo "GET $url -> $status"
          if [ "$status" != "200" ]; then
            echo "::error::Advisor health check returned $status (expected 200)"
            exit 1
          fi